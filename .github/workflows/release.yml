name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1) to build, attest and publish a GitHub release.
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # Builds and tests the whole solution, test packages (xunit) included. It runs on its own machine with read
  # access only: code from a test package never runs where the release is built or signed.
  test:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            Write-Output "::error::Tag '$env:TAG' is not v<major>.<minor>.<patch>[-suffix]"
            exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Releasing BlindsDown $version (.NET SDK $(dotnet --version))"

      - name: Restore
        run: dotnet restore BlindsDown.slnx

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build BlindsDown.slnx -c Release --no-restore "-p:Version=$env:VERSION"

      - name: No-network scan of the built program
        run: dotnet test BlindsDown.slnx -c Release --no-build --filter "FullyQualifiedName~BlindsDown.Tests.NoNetwork" --logger "console;verbosity=normal"

      - name: Test
        run: dotnet test BlindsDown.slnx -c Release --no-build --filter "FullyQualifiedName!~BlindsDown.Tests.NoNetwork" --logger "console;verbosity=normal"

  # Builds the release from a fresh checkout on a fresh machine and signs it. It never builds or loads the test
  # project, so the only packages it uses are the app's own: Microsoft's service package and build-time analyzer.
  build:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store the attestation on GitHub
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Latest .NET 10 patch: a self-contained exe ships the runtime it was built with.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish and zip
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($rid in @('win-x64', 'win-arm64')) {
            dotnet publish src/BlindsDown/BlindsDown.csproj -c Release -r $rid "-p:Version=$env:VERSION" -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed for $rid" }

            # The zip holds exactly the single-file exe plus the README and license. If publish ever writes
            # another file the app needs (e.g. a native DLL that single-file can't bundle), stop here rather
            # than release a zip that can't start. Debug symbols (.pdb) are the only expected extras.
            $unexpected = @(Get-ChildItem "publish/$rid" -Recurse -File | Where-Object { $_.Name -ne 'BlindsDown.exe' -and $_.Extension -ne '.pdb' })
            if ($unexpected.Count -gt 0) { throw "publish/$rid has files the zip would leave out: $($unexpected.Name -join ', ')" }

            $stage = "stage/$rid"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item -Path "publish/$rid/BlindsDown.exe", README.md, LICENSE -Destination $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/BlindsDown-$env:VERSION-$rid.zip"
          }

      # Same format as `sha256sum` (lowercase hash, two spaces, file name, LF line endings),
      # so both `sha256sum -c SHA256SUMS.txt` and PowerShell's Get-FileHash can check it.
      - name: SHA256SUMS.txt
        run: |
          $lines = Get-ChildItem dist -Filter *.zip | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      # Signed statement "these zips were built by this workflow from this commit". Anyone can check it
      # with: gh attestation verify <zip> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      # Created as a draft first and published only after every file is uploaded, so nobody can download
      # a half-finished release. If a step fails, delete the draft on GitHub and re-run the workflow.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist

          # The zips must still match the checksums written next to them when they were built.
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)

          # A quoted heredoc keeps the Markdown backticks literal; the placeholders are filled in below.
          cat > notes-template.md <<'EOF'
          BlindsDown @VERSION@: one hotkey locks every microphone and camera on your Windows PC, and puts them back exactly as they were. **It never connects to the internet.**

          ### Download
          - `BlindsDown-@VERSION@-win-x64.zip`: most Windows PCs (Intel or AMD)
          - `BlindsDown-@VERSION@-win-arm64.zip`: Windows on ARM (for example Snapdragon laptops)

          Unzip and run `BlindsDown.exe`. The microphone lock needs nothing installed. The camera lock is optional: it installs a small helper service, Windows asks for administrator permission once, and you can remove it again in BlindsDown's Settings > Camera or in Windows' Installed apps. The exe is not code-signed yet, so Windows SmartScreen may warn you: click **More info**, then **Run anyway**.

          ### Verify your download
          1. **Checksum.** In PowerShell: `Get-FileHash .\BlindsDown-@VERSION@-win-x64.zip -Algorithm SHA256`. The hash must match the line in `SHA256SUMS.txt`.
          2. **Build provenance.** With the GitHub CLI: `gh attestation verify BlindsDown-@VERSION@-win-x64.zip --repo @REPO@`. This proves the zip was built by this repository's release workflow, not uploaded by hand; the output shows the tag it was built from (`@TAG@`).

          See the README for how the "never connects to the internet" promise is enforced and how to check it yourself.
          EOF
          notes=$(<notes-template.md)
          notes=${notes//@VERSION@/$VERSION}
          notes=${notes//@TAG@/$TAG}
          notes=${notes//@REPO@/$GH_REPO}

          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$TAG" --draft --verify-tag --title "BlindsDown $VERSION" --notes "$notes" "${prerelease[@]}"
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt
          gh release edit "$TAG" --draft=false
