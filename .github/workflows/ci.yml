name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The latest .NET 10 patch (global.json allows any 10.0 SDK feature band), so builds use a
      # patched compiler and self-contained releases ship a patched runtime.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore BlindsDown.slnx

      - name: Build
        run: dotnet build BlindsDown.slnx -c Release --no-restore

      # Its own step so the guarantee is visible in every CI run: reads the compiled BlindsDown
      # assemblies and fails on any networking reference, unknown native DLL, COM class or package.
      - name: No-network scan of the built program
        run: dotnet test BlindsDown.slnx -c Release --no-build --filter "FullyQualifiedName~BlindsDown.Tests.NoNetwork" --logger "console;verbosity=normal"

      - name: Test
        run: dotnet test BlindsDown.slnx -c Release --no-build --filter "FullyQualifiedName!~BlindsDown.Tests.NoNetwork" --logger "console;verbosity=normal"
